<style id="app-style">
/* Layout: deep-green branded storefront, gold accents; sticky brand bar, category chips, product cards with size selectors, bottom-sheet cart. */
:root{
  --bg:#eef3ec; --surface:#ffffff; --fg:#14231a; --muted:#566b5c; --line:#d3dfd2; --chip:#e1ebdf;
  --brand:#0c4224; --brand-deep:#093019; --gold:#d6a021; --gold-soft:#f1dfae;
  --accent:#0c4224; --on-accent:#ffffff; --danger:#b3261e; --ok:#1c7a3d;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-display:'Noto Serif Bengali','Hind Siliguri',Georgia,serif;
  --f-latin:'Playfair Display',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09170e; --surface:#10261a; --fg:#eaf1e8; --muted:#9fb5a4; --line:#23402e; --chip:#17331f;
    --brand:#071d0e; --brand-deep:#05160a; --gold:#e5b232; --gold-soft:#4a3a10;
    --accent:#e5b232; --on-accent:#10230f; --danger:#f2a29c; --ok:#7fd49a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09170e; --surface:#10261a; --fg:#eaf1e8; --muted:#9fb5a4; --line:#23402e; --chip:#17331f;
  --brand:#071d0e; --brand-deep:#05160a; --gold:#e5b232; --gold-soft:#4a3a10;
  --accent:#e5b232; --on-accent:#10230f; --danger:#f2a29c; --ok:#7fd49a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;flex:none;display:block}
.brand b{display:block;font-family:var(--f-latin);font-size:1.35rem;line-height:1.1;color:var(--gold)}
.brand small{display:block;font-size:.78rem;letter-spacing:.08em;color:#cfe0d1}
.cartbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--gold);background:transparent;color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;flex:none}
.cartbtn .n{background:var(--gold);color:#10230f;border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:.85rem;padding:0 6px}
.admin{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;border-top:1px solid #ffffff26;font-size:.92rem}
.admin .tag{background:var(--gold);color:#10230f;border-radius:6px;padding:1px 8px;font-weight:700;font-size:.8rem}
.admin button{border:1.5px solid #ffffff66;background:transparent;color:#fff;border-radius:8px;padding:5px 12px}
.admin button.pub{background:var(--gold);border-color:var(--gold);color:#10230f;font-weight:700;margin-left:auto}
.admin button:disabled{opacity:.45;cursor:default}
.note{background:var(--gold-soft);color:var(--fg);border-radius:10px;padding:10px 14px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note button{border:1.5px solid currentColor;background:transparent;border-radius:8px;padding:4px 12px}

/* hero */
.hero{background:var(--brand-deep);color:#fff;border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:26px 24px;display:grid;gap:12px}
.eyebrow{margin:0;color:var(--gold);letter-spacing:.06em;font-weight:600;font-size:.9rem}
.hero h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.55rem,5.5vw,2.4rem);line-height:1.3;text-wrap:balance;max-width:22em}
.hero p{margin:0;color:#d6e4d8;max-width:38em}
.contact{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:#fff}
.contact span{user-select:all}
.wa{display:inline-flex;align-self:start;background:var(--gold);color:#10230f;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 16px}

/* tools */
.tools{padding-block:16px 4px;display:grid;gap:12px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 15px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* sections + cards */
.sec{padding-block:18px 6px}
.sec h2{margin:0 0 12px;font-family:var(--f-display);font-size:1.3rem;display:flex;align-items:center;gap:12px}
.sec h2::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--gold),transparent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr))}
.grid.ed{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.out .pic img,.card.out .pic .ph,.card.out .pic .art{opacity:.45}
.art{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 38%,#fff7de,#f1dfae)}
.art svg{width:100%;height:100%;display:block}
.lab{position:absolute;aspect-ratio:1;border-radius:50%;background:var(--logo) center/cover no-repeat;box-shadow:0 0 0 1.5px #d6a021}
.pic{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:var(--chip)}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.ph{background-color:var(--brand);background-image:var(--logo);background-repeat:no-repeat;background-position:center;background-size:58%}
.pic .tag{position:absolute;right:8px;top:8px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
.pic .tag.in{background:var(--chip);color:var(--ok)}
.pic .tag.no{background:var(--danger);color:#fff}
.price{font-family:var(--f-display);font-size:1.2rem;line-height:1.2}
.price b{font-weight:700}
.price small{font-family:var(--f-body);font-size:.82rem;color:var(--muted);font-weight:400}
.stepper{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--accent);border-radius:14px;height:46px;overflow:hidden;margin-top:auto}
.card .stepper button{flex:1;height:100%;border:0;background:transparent;font-size:1.5rem;font-weight:700;color:inherit;padding:0;border-radius:0}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-size:1.05rem}
.stepper.on{background:var(--accent);color:var(--on-accent)}
.card .stepper button:disabled{opacity:.35;cursor:default}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0 auto;max-width:720px;background:var(--brand);color:#fff;border-radius:20px 20px 0 0;border-top:2px solid var(--gold);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.cb-l{display:grid;line-height:1.25}
.cb-l span{font-size:.9rem;color:#d6e4d8}

.cb-btn{border:0;background:var(--gold);color:#10230f;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1.05rem}

.card h3{margin:0;font-size:1rem;line-height:1.35;font-weight:600;min-height:2.7em;text-wrap:balance}

.buy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.price{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap}

.add:disabled{opacity:.4;cursor:default}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* edit cards */
.card label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
.card input[type=text],.card input[type=number],.card select,.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn,.card button,.sheet .ghost{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:.88rem}
.btn{display:inline-block;cursor:pointer}
.vrow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;margin-bottom:6px}
.vrow button{padding:0}
.card .chk{display:flex;align-items:center;gap:8px;color:var(--fg)}
.card .chk input{width:auto}
.card button.add{border:0}
.card button.danger,.danger{color:var(--danger);border-color:var(--danger)}

}
@media (prefers-reduced-motion:no-preference){
  .card{transition:box-shadow .15s}
  .card:hover{box-shadow:0 4px 16px #0b2a1422}
}

  cart.forEach(function(c){var p=prod(c.pid);if(!p)return;var v=p.v.find(function(x){return x.id===c.vid});if(!v)return;out.push({p:p,v:v,q:c.q,t:v.p*c.q})});
  return out;
}
function fee(){return form.area==='out'?S.dOut:S.dIn}
function sub(){return lines().reduce(function(a,l){return a+l.t},0)}
function count(){return lines().reduce(function(a,l){return a+l.q},0)}
function saveCart(){store('pb-cart',cart)}
function toast(t){var e=$('#toast');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}

/* ---------- illustrated product art (stand-in until real photos are added) ---------- */
function hsh(s){var h=7;for(var i=0;i<s.length;i++)h=(Math.imul(h,31)+s.charCodeAt(i))>>>0;return h}
function rnd(seed){var s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.max(0,Math.min(255,Math.round(amt<0?c*(1+amt):c+(255-c)*amt)))}
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function label(cx,cy,rad){
  return '<i class="lab" style="left:'+((cx-rad)/2)+'%;top:'+((cy-rad)/2)+'%;width:'+rad+'%"></i>';
}
function drawArt(p){
  var a=p.art,c=a.c,u='a'+hsh(p.id),r=rnd(hsh(p.id)),s='',lb='',i;
  var lid=a.lid||'#0c4224';
  if(a.k==='jar'||a.k==='bottle'){
    s+='<defs><linearGradient id="'+u+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+shade(c[0],.28)+'"/><stop offset=".45" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+shade(c[0],-.32)+'"/></linearGradient>';
    if(a.k==='bottle')s+='<clipPath id="'+u+'c"><path d="M88 34h24v20c0 10 26 14 26 34v82c0 6-5 10-10 10H72c-5 0-10-4-10-10V88c0-20 26-24 26-34z"/></clipPath>';
    s+='</defs><ellipse cx="100" cy="178" rx="58" ry="7" fill="#0b2a14" fill-opacity=".18"/>';
  }
  if(a.k==='jar'){
    s+='<rect x="50" y="62" width="100" height="112" rx="20" fill="#fff" fill-opacity=".55" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>';
    s+='<rect x="55" y="78" width="90" height="91" rx="15" fill="url(#'+u+')"/>';
    s+='<ellipse cx="100" cy="80" rx="43" ry="4" fill="'+shade(c[0],.4)+'" fill-opacity=".85"/>';
    if(a.s==='comb'){for(i=0;i<9;i++){var hx=68+(i%3)*32+(Math.floor(i/3)%2)*14,hy=96+Math.floor(i/3)*20;s+='<polygon points="'+[0,1,2,3,4,5].map(function(k){return (hx+9*Math.cos(Math.PI/3*k+Math.PI/6)).toFixed(1)+','+(hy+9*Math.sin(Math.PI/3*k+Math.PI/6)).toFixed(1)}).join(' ')+'" fill="'+shade(c[0],.22)+'" fill-opacity=".7" stroke="'+shade(c[0],-.2)+'" stroke-opacity=".5"/>'}}
    s+='<rect x="62" y="86" width="9" height="70" rx="4.5" fill="#fff" fill-opacity=".32"/>';
    s+='<rect x="58" y="50" width="84" height="16" rx="3" fill="#e9efe4" stroke="#fff"/>';
    s+='<rect x="54" y="32" width="92" height="24" rx="6" fill="'+lid+'"/><rect x="54" y="48" width="92" height="4" fill="#d6a021"/>';
    lb=label(100,124,30);
  }else if(a.k==='bottle'){
    s+='<path d="M88 34h24v20c0 10 26 14 26 34v82c0 6-5 10-10 10H72c-5 0-10-4-10-10V88c0-20 26-24 26-34z" fill="#fff" fill-opacity=".55" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>';
    s+='<g clip-path="url(#'+u+'c)"><rect x="55" y="74" width="90" height="106" fill="url(#'+u+')"/><ellipse cx="100" cy="74" rx="40" ry="4" fill="'+shade(c[0],.4)+'" fill-opacity=".8"/></g>';
    s+='<rect x="69" y="92" width="8" height="70" rx="4" fill="#fff" fill-opacity=".32"/>';
    s+='<rect x="85" y="20" width="30" height="16" rx="3" fill="'+lid+'"/><rect x="85" y="30" width="30" height="3" fill="#d6a021"/>';
    lb=label(100,130,30);
  }else{
    s+='<ellipse cx="100" cy="178" rx="74" ry="8" fill="#0b2a14" fill-opacity=".18"/>';
    s+='<ellipse cx="100" cy="132" rx="70" ry="18" fill="#06210f"/>';
    if(a.s==='powder'){
      s+='<defs><linearGradient id="'+u+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+shade(c[0],.25)+'"/><stop offset=".5" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+shade(c[0],-.3)+'"/></linearGradient></defs>';
      s+='<path d="M36 134Q100 14 164 134Z" fill="url(#'+u+')"/>';
      for(i=0;i<70;i++){var py=60+r()*72,half=(py-60)/72*62+6,px=100+(r()*2-1)*half;s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(0.8+r()*1.2).toFixed(1)+'" fill="'+(r()<.5?shade(c[0],.3):shade(c[0],-.25))+'" fill-opacity=".55"/>'}
    }else{
      var n=Math.round((a.n||40)*(a.n>100?1.15:2)),z=a.z||1,items=[];
      for(i=0;i<n;i++){var y=86+r()*52,half=Math.pow((y-86)/52,.7)*56+10;items.push({y:y,x:100+(r()*2-1)*half,col:c[Math.floor(r()*c.length)],rot:r()*180})}
      items.sort(function(m,k){return m.y-k.y});
      items.forEach(function(it){
        var x=it.x.toFixed(1),y=it.y.toFixed(1),f=it.col,st=shade(f,-.35);
        if(a.s==='dot')s+='<circle cx="'+x+'" cy="'+y+'" r="'+(2.3*z).toFixed(1)+'" fill="'+f+'"/>';
        else if(a.s==='rice')s+='<ellipse cx="'+x+'" cy="'+y+'" rx="'+(4.4*z).toFixed(1)+'" ry="1.7" transform="rotate('+it.rot.toFixed(0)+' '+x+' '+y+')" fill="'+f+'" stroke="'+st+'" stroke-opacity=".4" stroke-width=".4"/>';
        else if(a.s==='lens')s+='<circle cx="'+x+'" cy="'+y+'" r="'+(3.8*z).toFixed(1)+'" fill="'+f+'" stroke="'+st+'" stroke-opacity=".45" stroke-width=".5"/>';
        else if(a.s==='sq')s+='<rect x="'+(it.x-7*z).toFixed(1)+'" y="'+(it.y-5*z).toFixed(1)+'" width="'+(14*z).toFixed(1)+'" height="'+(10*z).toFixed(1)+'" rx="2.5" transform="rotate('+(it.rot%40-20).toFixed(0)+' '+x+' '+y+')" fill="'+f+'" stroke="'+st+'" stroke-opacity=".5"/>';
        else if(a.s==='stick')s+='<rect x="'+(it.x-14).toFixed(1)+'" y="'+(it.y-2.2).toFixed(1)+'" width="28" height="4.4" rx="2.2" transform="rotate('+(it.rot%90-45).toFixed(0)+' '+x+' '+y+')" fill="'+f+'" stroke="'+st+'" stroke-opacity=".5"/>';
        else s+='<ellipse cx="'+x+'" cy="'+y+'" rx="'+(7.2*z).toFixed(1)+'" ry="'+(4.6*z).toFixed(1)+'" transform="rotate('+it.rot.toFixed(0)+' '+x+' '+y+')" fill="'+f+'" stroke="'+st+'" stroke-opacity=".55" stroke-width=".7"/>';
      });
    }
    s+='<path d="M30 132Q30 178 100 178Q170 178 170 132Q100 156 30 132Z" fill="#0c4224"/><path d="M30 132Q100 156 170 132" fill="none" stroke="#d6a021" stroke-width="3"/>';
    lb=label(100,158,15);
  }
  return '<div class="art"><svg viewBox="0 0 200 200" aria-hidden="true">'+s+'</svg>'+lb+'</div>';
}

/* ---------- product list ---------- */
function pic(p){if(!p.img&&p.art)return drawArt(p);return p.img?'<img class="pimg" src="'+p.img+'" alt="'+esc(p.n)+'" loading="lazy">':'<div class="pimg ph" role="img" aria-label="'+esc(p.n)+'"></div>'}
function qtyOf(p){var v=pv(p),c=cart.find(function(x){return x.pid===p.id&&x.vid===v.id});return c?c.q:0}
function syncSteppers(){
  document.querySelectorAll('#list .card[data-p]').forEach(function(el){
    var p=prod(el.getAttribute('data-p')),s=el.querySelector('.stepper');if(!p||!s)return;
    var q=qtyOf(p);s.querySelector('span').textContent=bn(q);s.classList.toggle('on',q>0);
  });
}
function bar(){
  var b=$('#bar');if(!b)return;
  var n=lines().length;b.hidden=n===0;document.body.classList.toggle('hasbar',n>0);
  if(n)b.innerHTML='<div class="cb-l"><span>'+bn(n)+'টি পণ্য</span><b>'+tk(sub())+'</b></div><button class="cb-btn" data-act="cart">অর্ডার করুন →</button>';
}
function viewCard(p){
  var v=pv(p),q=qtyOf(p),d=p.out?' disabled':'';
  return '<article class="card'+(p.out?' out':'')+'" data-p="'+p.id+'"><div class="pic">'+pic(p)+'<span class="tag '+(p.out?'no':'in')+'">'+(p.out?'স্টকে নেই':'স্টকে আছে')+'</span></div>'+
  '<h3>'+esc(p.n)+'</h3><div class="sizes">'+p.v.map(function(x){return '<button class="sz'+(x.id===v.id?' on':'')+'" data-act="size" data-v="'+x.id+'" aria-pressed="'+(x.id===v.id)+'">'+esc(x.l)+'</button>'}).join('')+'</div>'+
  '<div class="price"><b>'+tk(v.p)+'</b> <small>/ '+esc(v.l)+'</small></div>'+
  '<div class="stepper'+(q>0?' on':'')+'"><button data-act="qdec" aria-label="কমান"'+d+'>−</button><span>'+bn(q)+'</span><button data-act="qinc" aria-label="বাড়ান"'+d+'>+</button></div></article>';
}
function editCard(p){
  var armed=delArm===p.id;
  return '<article class="card" data-p="'+p.id+'"><div class="pic">'+pic(p)+'</div>'+
  '<div class="row"><label class="btn">ছবি '+(p.img?'বদলান':'যোগ করুন')+'<input type="file" accept="image/*" hidden data-file="1"></label>'+(p.img?'<button data-act="rmimg">ছবি সরান</button>':'')+'</div>'+
  '<label>পণ্যের নাম<input type="text" data-f="n" value="'+esc(p.n)+'"></label>'+
  '<label>ক্যাটাগরি<select data-f="c">'+state.cats.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===p.c?' selected':'')+'>'+esc(c.n)+'</option>'}).join('')+'</select></label>'+
  '<div><div class="sub" style="font-size:.85rem;color:var(--muted);margin-bottom:4px">সাইজ ও দাম (টাকা)</div>'+p.v.map(function(x){return '<div class="vrow" data-v="'+x.id+'"><input type="text" data-f="vl" value="'+esc(x.l)+'" aria-label="সাইজ"><input type="number" min="0" inputmode="numeric" data-f="vp" value="'+x.p+'" aria-label="দাম"><button data-act="delv" aria-label="এই সাইজ মুছুন">×</button></div>'}).join('')+'<button data-act="addv">+ সাইজ যোগ করুন</button></div>'+
  '<label class="chk"><input type="checkbox" data-f="out"'+(p.out?' checked':'')+'> স্টকে নেই</label>'+
  '<button class="danger" data-act="delp">'+(armed?'আবার চাপলে মুছে যাবে':'পণ্য মুছুন')+'</button></article>';
}
function list(){
  var h='',any=false;
  state.cats.forEach(function(c){
    if(cat!=='all'&&cat!==c.id)return;
    var ps=state.prods.filter(function(p){return p.c===c.id&&(!q||p.n.indexOf(q)>-1)});
    if(!ps.length&&!(edit&&cat===c.id))return;
    any=true;
    h+='<section class="sec"><h2>'+esc(c.n)+'</h2><div class="grid'+(edit?' ed':'')+'">'+ps.map(edit?editCard:viewCard).join('')+'</div></section>';
  });
  if(!any)h='<p class="empty">এই নামে কোনো পণ্য পাওয়া যায়নি।</p>';
  $('#list').innerHTML=h;
}
function dirtyNow(){
  dirty=true;var b=$('[data-act="publish"]');if(b&&!busy)b.disabled=false;
}

/* ---------- sheet ---------- */
function openSheet(v){sheet=v;err='';renderSheet()}
function closeSheet(){sheet=null;$('#sheetHost').innerHTML='';head()}
function renderSheet(){
  var host=$('#sheetHost');
  if(!sheet){host.innerHTML='';return}
  var body='',title='';
  if(sheet==='cart'){title='আপনার কার্ট';body=cartBody()}
  else if(sheet==='done'){title='অর্ডার প্রায় শেষ';body=doneBody()}
  else if(sheet==='settings'){title='দোকানের সেটিংস';body=setBody()}
  host.innerHTML='<div class="back" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="sh-h"><h2>'+title+'</h2><button class="x" data-act="close" aria-label="বন্ধ করুন">×</button></div>'+body+'</section>';
}
function cartBody(){
  var ls=lines();
  if(!ls.length)return '<p class="empty">কার্ট খালি। পছন্দের পণ্য কার্টে যোগ করুন।</p><button class="cta alt" data-act="close">কেনাকাটা চালিয়ে যান</button>';
  var h=ls.map(function(l){return '<div class="line" data-p="'+l.p.id+'" data-v="'+l.v.id+'"><div><div class="nm">'+esc(l.p.n)+'</div><div class="sub">'+esc(l.v.l)+' · '+tk(l.v.p)+'</div>'+
    '<div><span class="qty"><button data-act="dec" aria-label="কমান">−</button><span>'+bn(l.q)+'</span><button data-act="inc" aria-label="বাড়ান">+</button></span><button class="rm" data-act="del">সরান</button></div></div><div class="tot">'+tk(l.t)+'</div></div>'}).join('');
  var f=fee(),s=sub();
  h+='<div class="sum"><div><span>পণ্যের মূল্য</span><span>'+tk(s)+'</span></div><div><span>ডেলিভারি চার্জ</span><span>'+tk(f)+'</span></div><div class="g"><span>সর্বমোট</span><span>'+tk(s+f)+'</span></div></div>';
  h+='<div class="f"><label>আপনার নাম<input type="text" data-form="name" autocomplete="name" value="'+esc(form.name)+'"></label>'+
   '<label>মোবাইল নম্বর<input type="tel" inputmode="tel" data-form="phone" autocomplete="tel" placeholder="01XXXXXXXXX" value="'+esc(form.phone)+'"></label>'+
   '<label>পূর্ণ ঠিকানা<textarea data-form="addr" autocomplete="street-address" placeholder="বাসা/রোড, এলাকা, থানা, জেলা">'+esc(form.addr)+'</textarea></label>'+
   '<label>ডেলিভারি এলাকা<select data-form="area"><option value="in"'+(form.area==='in'?' selected':'')+'>ঢাকা সিটির ভিতরে ('+tk(S.dIn)+')</option><option value="out"'+(form.area==='out'?' selected':'')+'>ঢাকার বাইরে ('+tk(S.dOut)+')</option></select></label>'+
   '<label>অতিরিক্ত নোট (ঐচ্ছিক)<input type="text" data-form="note" value="'+esc(form.note)+'"></label></div>'+
   '<div class="pay">পেমেন্ট: ক্যাশ অন ডেলিভারি। পণ্য হাতে পেয়ে টাকা দিন।</div><p class="err" id="err" role="alert">'+esc(err)+'</p>'+
   '<button class="cta" data-act="order">অর্ডার তৈরি করুন</button>';
  return h;
}
function orderMsg(){
  var ls=lines(),s=sub(),f=fee(),id='PB-'+Date.now().toString(36).toUpperCase().slice(-6);
  var m='নতুন অর্ডার, PureBite\nঅর্ডার নং: '+id+'\n\nনাম: '+form.name+'\nমোবাইল: '+form.phone+'\nঠিকানা: '+form.addr+'\nএলাকা: '+(form.area==='out'?'ঢাকার বাইরে':'ঢাকা সিটির ভিতরে')+'\n';
  if(form.note)m+='নোট: '+form.note+'\n';
  m+='\nপণ্য:\n';
  ls.forEach(function(l,i){m+=bn(i+1)+'. '+l.p.n+' ('+l.v.l+') × '+bn(l.q)+' = '+tk(l.t)+'\n'});
  m+='\nপণ্যের মূল্য: '+tk(s)+'\nডেলিভারি চার্জ: '+tk(f)+'\nসর্বমোট: '+tk(s+f)+'\nপেমেন্ট: ক্যাশ অন ডেলিভারি';
  return m;
}

/* ---------- image ---------- */
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var m=720,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.8));
  };im.onerror=function(){toast('ছবিটি খোলা যায়নি')};im.src=r.result};
  r.readAsDataURL(file);
}

/* ---------- publish ---------- */
function buildDoc(){
  var css=$('#app-style').textContent,js=$('#app-js').textContent,fonts=$('#fonts').outerHTML;
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  return SK.head+'<title>PureBite</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+fonts+'\n<style id="app-style">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="data">'+data+'<\/script>\n<script id="app-js">'+js+'<\/script>\n'+SK.tail;
}
function publish(){
  if(busy||!dirty)return;
  if(!art||!SK.head){toast('এই ভার্সনে প্রকাশ করা যাচ্ছে না');return}
  var html=buildDoc();
  if(html.length>15000000){toast('ছবি বেশি হয়ে গেছে, কিছু ছবি সরান বা ছোট করুন');return}
  busy=true;head();
  art.publish(html).then(function(){toast('প্রকাশ হয়েছে')}).catch(function(e){
    busy=false;head();
    var c=e&&e.code;
    if(c==='conflict')toast('অন্য কেউ আগে প্রকাশ করেছে, পেজ নতুন করে লোড হচ্ছে');
    else if(c==='not_writer'||c==='not_granted'){canEdit=false;edit=false;head();list();toast('এই অ্যাকাউন্ট থেকে প্রকাশ করা যায় না')}
    else if(c==='too_large')toast('পেজ অনেক বড়, কিছু ছবি সরান');
    else toast('প্রকাশ করা যায়নি, আবার চেষ্টা করুন');
  });
}

/* ---------- events ---------- */
var root=document.getElementById('root');
function pidOf(el){var a=el.closest('[data-p]');return a?a.getAttribute('data-p'):null}
function vidOf(el){var a=el.closest('[data-v]');return a?a.getAttribute('data-v'):null}
root.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),pid=pidOf(el),p=pid?prod(pid):null;
  switch(act){
  case 'cat':cat=el.getAttribute('data-c');chips();list();break;
  case 'size':if(p){sel[p.id]=vidOf(el);var cd=el.closest('.card');cd.outerHTML=viewCard(p)}break;
  case 'qinc':if(p&&!p.out){var qv=pv(p),qf=cart.find(function(c){return c.pid===p.id&&c.vid===qv.id});if(qf)qf.q++;else cart.push({pid:p.id,vid:qv.id,q:1});saveCart();syncSteppers();head()}break;
  case 'qdec':if(p){var dv=pv(p),df=cart.find(function(c){return c.pid===p.id&&c.vid===dv.id});if(df){df.q--;if(df.q<=0)cart.splice(cart.indexOf(df),1);saveCart();syncSteppers();head()}}break;
  case 'add':if(p){var v=pv(p),f=cart.find(function(c){return c.pid===p.id&&c.vid===v.id});if(f)f.q++;else cart.push({pid:p.id,vid:v.id,q:1});saveCart();head();toast(p.n+' ('+v.l+') কার্টে যোগ হয়েছে')}break;
  case 'cart':openSheet('cart');break;
  case 'close':closeSheet();break;
  case 'inc':case 'dec':case 'del':{
    var l=el.closest('.line'),c=cart.find(function(x){return x.pid===l.getAttribute('data-p')&&x.vid===l.getAttribute('data-v')});
    if(c){if(act==='inc')c.q++;else if(act==='dec')c.q=Math.max(1,c.q-1);else cart.splice(cart.indexOf(c),1);saveCart();renderSheet();syncSteppers();head()}
    break}
  case 'order':{
    var ph=String(form.phone).replace(/[০-৯]/g,function(d){return '০১২৩৪৫৬৭৮৯'.indexOf(d)}).replace(/[\s-]/g,'');
    if(!lines().length)err='কার্ট খালি।';
    else if(form.name.trim().length<2)err='আপনার নাম লিখুন।';
    else if(!/^(?:\+?88)?01[3-9]\d{8}$/.test(ph))err='সঠিক মোবাইল নম্বর দিন, যেমন 01XXXXXXXXX।';
    else if(form.addr.trim().length<8)err='পূর্ণ ঠিকানা লিখুন (বাসা/রোড, এলাকা, থানা, জেলা)।';
    else{err='';form.phone=ph;store('pb-form',{name:form.name,phone:form.phone,addr:form.addr,area:form.area});lastMsg=orderMsg();openSheet('done');break}
    var e=$('#err');if(e)e.textContent=err;break}
  case 'copy':
    var done=function(){toast('মেসেজ কপি হয়েছে')},sel2=function(){var r=document.createRange();r.selectNodeContents($('#msg'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('মেসেজটি সিলেক্ট হয়েছে, কপি করুন')};
    try{navigator.clipboard.writeText(lastMsg).then(done,sel2)}catch(e){sel2()}break;
  case 'finish':cart=[];saveCart();closeSheet();syncSteppers();head();break;
  /* admin */
  case 'edit':edit=!edit;head();list();break;
  case 'notedone':S.note=false;dirtyNow();head();break;
  case 'publish':publish();break;
  case 'settings':openSheet('settings');break;
  case 'newp':{
    var c0=cat!=='all'?cat:state.cats[0].id,np={id:'p'+Date.now().toString(36),n:'নতুন পণ্য',c:c0,img:'',out:false,v:[{id:'v1',l:'২৫০ গ্রাম',p:0},{id:'v2',l:'৫০০ গ্রাম',p:0},{id:'v3',l:'১ কেজি',p:0}]};
    state.prods.unshift(np);cat=c0;chips();list();dirtyNow();var n=$('[data-p="'+np.id+'"] [data-f="n"]');if(n){n.scrollIntoView({block:'center'});n.focus();n.select()}break}
  case 'rmimg':if(p){p.img='';list();dirtyNow()}break;
  case 'addv':if(p){p.v.push({id:'v'+Date.now().toString(36),l:'নতুন সাইজ',p:0});list();dirtyNow()}break;
  case 'delv':if(p&&p.v.length>1){var vid=vidOf(el);p.v=p.v.filter(function(x){return x.id!==vid});list();dirtyNow()}else toast('অন্তত একটি সাইজ রাখতে হবে');break;
  case 'delp':if(p){if(delArm===p.id){state.prods=state.prods.filter(function(x){return x.id!==p.id});delArm=null;dirtyNow()}else delArm=p.id;list()}break;
  case 'addcat':{var inp=$('#newcat'),nm=inp&&inp.value.trim();if(nm){state.cats.push({id:'c'+Date.now().toString(36),n:nm});dirtyNow();chips();renderSheet();list()}break}
  }
});
root.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){q=t.value.trim();list();return}
  var fk=t.getAttribute('data-form');
  if(fk){form[fk]=t.value;if(fk==='area'){renderSheet()}return}
  var sk=t.getAttribute('data-set');
  if(sk){S[sk]=(sk==='dIn'||sk==='dOut')?Math.max(0,Number(t.value)||0):t.value.trim();dirtyNow();contact();return}
  var ck=t.getAttribute('data-cat');
  if(ck){var c=state.cats.find(function(x){return x.id===ck});if(c){c.n=t.value;dirtyNow();chips();list()}return}
  var f=t.getAttribute('data-f');if(!f)return;
  var p=prod(pidOf(t));if(!p)return;
  if(f==='n')p.n=t.value;
  else if(f==='c'){p.c=t.value;list()}
  else if(f==='out'){p.out=t.checked}
  else{var v=p.v.find(function(x){return x.id===vidOf(t)});if(v){if(f==='vl')v.l=t.value;else v.p=Math.max(0,Number(t.value)||0)}}
  dirtyNow();
});
root.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.getAttribute&&t.getAttribute('data-file')&&t.files&&t.files[0]){
    var p=prod(pidOf(t));if(!p)return;
    shrink(t.files[0],function(u){p.img=u;list();dirtyNow()});
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet()});

shell();

  try{
    if(!window.claude||!claude.use)return;
    var u=await claude.use('user');
    canEdit=!!(u&&u.canEdit&&u.canEdit());
    art=await claude.use('artifact');
    head();
  }catch(e){}
})();
})();
